<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Toby Studio</title>
  <meta name="description" content="Human">
  <link rel="icon" href="./res/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <div id="main_div">
    <div id="top_bar">
      <img src="res/white.svg" alt="#" id="bts_logo" />
      <h1 id="bts_title">Blue Toby Studio</h1>
    </div>
    <div id="content">
      <!-- <h2 id="bts_content">
                The Blue Toby Studio is a <strong>human-driven</strong> game studio initiated in 2026.
            </h2> -->
      <!-- <p id="bts_story">
                As I would love to work on the identity and the website of the studio, I am currently focused on Sonoklo, a
                next-to-be-released puzzle game, and my university studies. Instead of a placeholder or a sloppy page,
                this note will do just fine for now.
            </p> -->
      <div class="buttons_div">
        <button class="contact_button" id="contact_button"
          onclick="window.location.href='mailto:talk@bluetobystudio.com'">
          <div class=" svg-wrapper-1">
            <div class="svg-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
                <path fill="none" d="M0 0h24v24H0z"></path>
                <path fill="#0f0f0f"
                  d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z">
                </path>
              </svg>
            </div>
          </div>
          <b>Get in touch</b>
        </button>
      </div>
      <div id="bottom_spacer"></div>
    </div>
  </div>
  <div class="newsletterpopup" id="npp">
    <div class="newslettertop">
        <h2 class="newslettertitle">
          Newsletter
        </h2>
        <button class="newsletterclosebutton" id="ncb">
          Close
        </button>
    </div>
    <div class="newslettersubtop">
        <h2 class="newslettersubtitle">
          Stay up to date on the studio's progress
        </h2>
    </div>
    <div class="newslettercontent">
        <form class="subform" action="#" method="POST" id="nf"
          class="embeddable-buttondown-form">
          <input class="email_input" type="email" name="email" id="nei" placeholder="youremail@example.com" />
          <button class="submit_button" type="submit" id="nsb">
            Subscribe
          </button>
        </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
